# To install deps from toml
# -------------------------
# > make install


[build-system]
requires = [
  "setuptools>=61.0.0",  # for PEP 621 metadata support (fully pyproject.toml projects only)
  "wheel"                # any recent wheel
]
build-backend = "setuptools.build_meta"

[project]
name = "afk"
description = "Commandline utility to occasionally move the mouse when you are away from the keyboard, but want it to not sleep or time out."
version = "2026.6.11.2"
authors = [{name = "Travis L. Seymour, PhD", email = "nogard@ucsc.edu"}]
license = {text = "GPLv3"}
readme = "ReadMe.md"
requires-python = ">=3.11,<3.14"
keywords = ["utility", "mouse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent"
]
dependencies = [
  "typer>=0.12.0",
  "pynput>=1.7.6",
]


[project.urls]
"Bug Tracker" = "https://github.com/travisseymour/afk/issues"
"Documentation" = "https://github.com/travisseymour/afk#readme"

[project.optional-dependencies]
dev = [
  "ruff>=0.11.6,<1.0.0",
  "build>=1.2.2.post1,<2.0.0",
]

[project.scripts]
afk = "afk.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["afk*"]

# pull in any files in the resources folder for use with importlib.resources
[tool.setuptools]
include-package-data = true

[tool.black]
line-length = 120

# ==========================
# Ruff configuration
# ==========================

[tool.ruff]
target-version = "py312"
line-length = 120
# these are generated by pyside, so ignore it.
exclude = []

# ==========================
# Ruff configuration
# ==========================

[tool.ruff.lint]
select = [
  "E",   # py_code_style errors
  "F",   # py_flakes
  "W",   # py_code_style warnings
  "I",   # i_sort (imports)
  "B",   # flake8-bugbear
  "UP",  # py_upgrade
  "N",   # pep8-naming
]

ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ==========================
# Pyright configuration
# (Pyright >= 1.1.311 can read this)
# ==========================
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"  # "strict"

# Paths where your main code lives
include = [
  "afk",
]


